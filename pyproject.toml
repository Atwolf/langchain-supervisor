[project]
name = "langchain-supervisor"
version = "0.1.0"
description = "A multiagent framework using a supervisor agent for intelligent query routing"
requires-python = ">=3.12"
authors = [
    { name = "Aakash Tammana" }
]
maintainers = [
    { name = "Aakash Tammana" }
]
dependencies = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "chainlit>=1.0",
    "mcp>=1.0",
    "langchain-mcp-adapters>=0.1",
    "pyjwt>=2.0",
    "python-dotenv>=1.2.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0",
    "langchain-core>=1.2.7",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-langchain>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pylint>=4.0.4",
]
