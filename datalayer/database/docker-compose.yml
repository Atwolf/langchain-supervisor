services:
  postgres:
    image: postgres:16-alpine
    container_name: chainlit-postgres
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit_password
      POSTGRES_DB: chainlit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
